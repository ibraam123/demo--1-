spring:
  application:
    name: car-rental-api

  datasource:
    url: jdbc:mysql://localhost:3306/car_rental?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ibraamRoot123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically create/update schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false # Let Hibernate handle the schema initially to avoid conflicts

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/carrentalvelocify

server:
  port: 8080

app:
  jwt:
    secret: aVerySecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm
    expirationMs: 86400000 # 24 hours

