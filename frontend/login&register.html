<body class="bg-background text-on-background min-h-screen flex flex-col">

        <header class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
                <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                        <a class="font-['Inter'] text-sm font-medium tracking-tight text-slate-600 hover:text-blue-600 transition-colors flex items-center gap-2"

                                <span class="material-symbols-outlined">arrow_back</span>

                                <!-- Tab Switcher -->
                                <div class="flex p-base bg-surface-container rounded-lg mb-md">

                                                                type="email" />
                                                </div>
                                        </div>
                                        <div class="space-y-xs">
                                                <div class="flex justify-between px-1">
                                                        <label class="font-label-sm text-label-sm text-on-surface-variant"
                                                                for="password">Password</label>
                                                        <!-- <a class="font-label-sm text-label-sm text-primary hover:underline"
                                                                href="#">Forgot?</a> -->
                                                </div>
                                                <div class="relative">
                                                        <span
                                                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
                                                        <input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container transition-colors placeholder:text-outline/50"
                                                                id="password" placeholder="••••••••" type="password" />
                                                </div>
                                        </div>
                                        <div class="flex items-center gap-xs py-xs px-1">
                                                <input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary"
                                                        id="remember" type="checkbox" />
                                                <label class="font-label-sm text-label-sm text-on-surface-variant"
                                                        for="remember">Stay logged in for 30 days</label>
                                        </div>
                                        <button class="w-full h-[48px] bg-primary-container text-white font-button text-button rounded-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2"
                                                id="login-btn"
                                                type="submit">
                                                Continue to Dashboard
                                                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                                        </button>
                                </form>
                                <!-- Sign Up Form -->
                                <form id="signup-form" class="hidden space-y-sm" action="adminDashboard.html">
                                        <div class="space-y-xs">
                                                <label class="font-label-sm text-label-sm text-on-surface-variant px-1"
                                                        for="signup-name">Full Name</label>
                                                <div class="relative">
                                                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
                                                        <input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container transition-colors placeholder:text-outline/50"
                                                                id="signup-name" placeholder="Alex Rivers" type="text" required />
                                                </div>
                                        </div>
                                        <div class="space-y-xs">
                                                <label class="font-label-sm text-label-sm text-on-surface-variant px-1"
                                                        for="signup-email">Email Address</label>
                                                <div class="relative">
                                                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
                                                        <input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container transition-colors placeholder:text-outline/50"
                                                                id="signup-email" placeholder="name@company.com" type="email" required />
                                                </div>
                                        </div>
                                        <div class="space-y-xs">
                                                <label class="font-label-sm text-label-sm text-on-surface-variant px-1"

                                                <div class="relative">

                                                        <input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container transition-colors placeholder:text-outline/50"
                                                                id="signup-password" placeholder="••••••••" type="password" required />
                                                </div>
                                        </div>
                                        <div class="flex items-center gap-xs py-xs px-1">
                                                <input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary"
                                                        id="agree-terms" type="checkbox" required />
                                                <label class="font-label-sm text-label-sm text-on-surface-variant"
                                                        for="agree-terms">I agree to the Terms of Service</label>
                                        </div>
                                        <button class="w-full h-[48px] bg-primary-container text-white font-button text-button rounded-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2"
                                                id="create-account-btn"
                                                type="submit">
                                                Create Account

                                        </button>
                                </form>
                                <!-- Divider -->
                                <div class="relative my-md">
                                        <div class="absolute inset-0 flex items-center">
                                                <div class="w-full border-t border-outline-variant"></div>

                    </button>
</div> -->
                        </div>
                        <!-- Footer / Support Link -->
                        <p class="mt-md text-center font-label-sm text-label-sm text-on-surface-variant">
                                Need help? <a class="text-primary hover:underline" href="#">Contact our concierge
                                        team</a>
                        </p>
                </div>
        </main>
        <!-- Visual Background Element (Subtle soft gradient to break whitespace) -->
        <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
                <div
                        class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-fixed opacity-20 blur-[120px] rounded-full">
                </div>
                <div
                        class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary-fixed opacity-30 blur-[120px] rounded-full">
                </div>
        </div>
        <!-- Footer: Execution of Shared Component logic -->
        <footer class="w-full border-t border-slate-200 bg-slate-50">
                <div class="max-w-7xl mx-auto py-12 px-6 flex flex-col md:flex-row justify-between items-center gap-8">
                        <div class="flex flex-col gap-2">
                                <div class="text-lg font-bold text-slate-900">Velocify</div>
                                <div class="font-['Inter'] text-xs text-slate-500">© 2026 Velocify Technologies. All
                                        rights reserved.</div>
                        </div>
                        <div class="flex gap-md">
                                <a class="font-['Inter'] text-xs text-slate-500 hover:text-blue-600 underline underline-offset-4 transition-opacity"
                                        href="#">Terms of Service</a>
                                <a class="font-['Inter'] text-xs text-slate-500 hover:text-blue-600 underline underline-offset-4 transition-opacity"
                                        href="#">Privacy Policy</a>
                        </div>
                </div>
        </footer>
        <script>
                function switchTab(tab) {
                        const loginForm = document.getElementById('login-form');
                        const signupForm = document.getElementById('signup-form');
                        const loginTab = document.getElementById('login-tab');
                        const signupTab = document.getElementById('signup-tab');
                        const formTitle = document.getElementById('form-title');
                        const formSubtitle = document.getElementById('form-subtitle');

                        if (tab === 'login') {
                                loginForm.classList.remove('hidden');
                                signupForm.classList.add('hidden');
                                
                                loginTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                                loginTab.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                                
                                signupTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                                signupTab.classList.add('text-on-surface-variant', 'hover:text-on-surface');
                                
                                formTitle.textContent = 'Welcome Back';
                                formSubtitle.textContent = 'Access your premium fleet and bookings.';
                        } else {
                                signupForm.classList.remove('hidden');
                                loginForm.classList.add('hidden');
                                
                                signupTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                                signupTab.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                                
                                loginTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                                loginTab.classList.add('text-on-surface-variant', 'hover:text-on-surface');
                                
                                formTitle.textContent = 'Create an Account';
                                formSubtitle.textContent = 'Join Velocify to book your first ride.';
                        }
                }

                document.addEventListener('DOMContentLoaded', () => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const tab = urlParams.get('tab');
                        if (tab === 'signup') {
                                switchTab('signup');
                        }
                });
        </script>

        <script type="module" src="./assets/js/login&register.js"></script>
        <script src="./assets/js/footer-modal.js"></script>
